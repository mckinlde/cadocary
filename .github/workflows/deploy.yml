name: Deploy to GitHub Pages

# Build the Astro site and deploy it to GitHub Pages.
#
# GitHub Pages cannot run `astro build` on its own, so this workflow does the
# build and publishes the resulting static `dist/` output. It runs on every push
# to `main` (e.g. when the redesign PR is merged) and can also be triggered
# manually. After the first successful run, set the repository's
# Settings > Pages > Source to "GitHub Actions".
#
# The custom domain (cadocary.com) is preserved because `public/CNAME` is copied
# into `dist/` on every build.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege permissions required by the Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
